name: rates
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright
      - run: playwright install --with-deps chromium
      - name: Kurslarni olish
        run: python fetch_rates.py
      - name: Debug fayllarni saqlash
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug
          path: debug/
          if-no-files-found: ignore
      - name: Saqlash
        if: always()
        run: |
          git config user.name "rates-bot"
          git config user.email "bot@users.noreply.github.com"
          git add rates.json
          git diff --cached --quiet || (git commit -m "rates" && git pull --rebase && git push)
